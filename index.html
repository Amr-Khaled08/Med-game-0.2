 document.getElementById("jn").onclick=function(){var c=document.getElementById("cd").value.trim().toUpperCase();if(c.length!==4){document.getElementById("er").textContent="The code has 4 characters.";return}joinRoom(c,null)};
}
function mkRoom(id,l,t){
 var n=getQ(id,l).length,o=[];for(var i=0;i<n;i++)o.push(i);o=shuf(o).slice(0,QPR);
 var c="",a="ABCDEFGHJKMNPQRSTUVWXYZ23456789";for(var j=0;j<4;j++)c+=a[Math.floor(Math.random()*a.length)];
 joinRoom(c,{id:id,l:l,t:t,o:o})
}
function dPool(mi,lid){var p=[];CUR.forEach(function(m,i){if(mi!=null&&i!==mi)return;m.subs.forEach(function(s){s.lec.forEach(function(L,j){var id=m.id+"."+s.id+"."+(j+1);if(lid!=null&&id!==lid)return;dHas(id).forEach(function(l){p.push({id:id,l:l,t:m.n+" · "+L[0]})})})})});return p}
function duelPick(mi,lid,lt){
 var RB='<button class="btn nav" id="rnd">🎲 Random<br><small>'+(lid!=null?"Random difficulty":mi!=null?"Random lecture &amp; difficulty":"Random subject, lecture &amp; difficulty")+'</small></button><p>Or choose yourself:</p>';
 var h='<button class="btn back" id="bk">Back</button><h2>🎲 Create a room</h2>',any=0;
 if(mi==null){
  h+=RB+'<p>1️⃣ Choose a subject:</p>';
  CUR.forEach(function(m,i){var ok=0;m.subs.forEach(function(s){s.lec.forEach(function(L,j){if(dHas(m.id+"."+s.id+"."+(j+1)).length)ok=1})});if(ok){any=1;h+='<button class="opt" data-m="'+i+'">'+(m.e||"")+" "+esc(m.n)+'</button>'}});
 }else if(lid==null){
  h+=RB+'<p>2️⃣ Choose a lecture:</p>';
  CUR[mi].subs.forEach(function(s){s.lec.forEach(function(L,j){var id=CUR[mi].id+"."+s.id+"."+(j+1);if(dHas(id).length){any=1;h+='<button class="opt" data-id="'+id+'" data-t="'+esc(L[0])+'">'+(s.e||"")+" "+esc(s.n)+" · "+esc(L[0])+'</button>'}})});
 }else{
  h+=RB+'<p>3️⃣ Choose the difficulty:</p>';
  dHas(lid).forEach(function(l){any=1;h+='<button class="opt" data-l="'+l+'">'+["","🟢 ","🟡 ","🔴 "][l]+LN[l]+'</button>'});
 }
 if(!any){h=h.replace(RB,"");h+="<p>No questions yet. Add questions to create a duel room.</p>"}
 g.innerHTML=h;
 var rn=document.getElementById("rnd");if(rn)rn.onclick=function(){var p=dPool(mi,lid);if(!p.length)return;var x=p[Math.floor(Math.random()*p.length)];mkRoom(x.id,x.l,x.t)};
 document.getElementById("bk").onclick=function(){if(lid!=null)duelPick(mi);else if(mi!=null)duelPick();else duelMenu()};
 g.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
  if(lid!=null){
   mkRoom(lid,+b.dataset.l,CUR[mi].n+" · "+lt)
  }else if(mi!=null)duelPick(mi,b.dataset.id,b.dataset.t);
  else duelPick(+b.dataset.m)}});
}
function joinRoom(code,meta){
 DU={code:code,ph:"lobby",ready:false,pl:{},meta:meta,ref:db.ref("rooms/"+code)};
 if(meta)DU.ref.child("meta").set(meta);
 var me=DU.ref.child("players/"+P.id);me.set({name:P.name,ready:false,score:0,done:false});me.onDisconnect().remove();
 DU.ref.on("value",function(s){
  if(!DU)return;var v=s.val()||{};DU.pl=v.players||{};if(v.meta)DU.meta=v.meta;var o=opp();
  if(DU.ph==="lobby")lobby(o);else if(DU.ph==="play")oppBar(o);else if(DU.ph==="end")duelEnd(o);
  if(DU.ph==="lobby"&&o&&DU.ready&&o.ready&&DU.meta){DU.ph="play";startDuel()}
 });
}
function lobby(o){
 g.className="card";
 g.innerHTML='<h2>Duel Lobby</h2><p>Share this code with your opponent:</p><div class="code">'+esc(DU.code)+'</div><p>'+(DU.meta?esc(DU.meta.t)+" · "+LN[DU.meta.l]:"Waiting for room info…")+'</p><p>'+(o?'⚔️ <b>'+esc(o.name)+'</b> '+(o.ready?"is ready!":"joined"):"Waiting for opponent…")+'</p><button class="btn" id="rd"'+(o&&DU.meta?"":" disabled")+'>'+(DU.ready?"Ready! Waiting…":"I'm ready")+'</button> <button class="btn back" id="bk">Leave</button>';
 document.getElementById("bk").onclick=home;
 document.getElementById("rd").onclick=function(){DU.ready=true;DU.ref.child("players/"+P.id).update({ready:true})};
}
function startDuel(){
 var m=DU.meta,all=getQ(m.id,m.l),qs=m.o.map(function(i){return all[i]}).filter(Boolean);
 if(!qs.length){g.innerHTML='<p>Your version does not have this room\'s questions. Update the game and try again.</p><button class="btn" id="bk">Back</button>';document.getElementById("bk").onclick=home;return}
 R={id:m.id,l:m.l,t:m.t,qs:qs,i:0,bad:0,duel:true,score:0,log:[],st:0,best:0};showQ();
}
function oppBar(o){var e=document.getElementById("op");if(e)e.textContent=o?"⚔️ "+o.name+": ⭐ "+(o.score||0)+(o.done?" ✔":""):"⚔️ Opponent left"}
function duelFinish(){DU.ph="end";DU.ref.child("players/"+P.id).update({done:true,score:R.score});duelEnd(opp())}
function duelEnd(o){
 var s=R.score,h='<p class="big">'+s+'</p>',os=o?(o.score||0):0;
 if(!o)h+="<h2>Opponent left 🏳️</h2><p>You win by forfeit!</p>";
 else if(!o.done)h+='<h2>Finished!</h2><p>Waiting for '+esc(o.name)+'… (now '+os+')</p>';
 else h+=(s>os?"<h2>You win! 🏆</h2>":s<os?"<h2>You lost 💔</h2>":"<h2>Draw 🤝</h2>")+'<p>'+s+' vs '+esc(o.name)+': '+os+'</p>';
 if(DU&&!DU.counted&&(!o||(o.done&&s>os))){DU.counted=1;P.st.wins++;checkTr()}
 g.innerHTML=h+'<button class="btn" id="bk">Main menu</button>';
 document.getElementById("bk").onclick=home;
}
document.addEventListener("click",function(e){
 var b=e.target.closest&&e.target.closest("button");if(!b||b.disabled)return;
 if(b.classList.contains("opt")||b.classList.contains("mi")||b.dataset.id||b.id==="mas")return;
 if(b.classList.contains("pw")){sfx(880,.12,"sine");return}
 sfx(b.classList.contains("back")?300:420+DEP*90,.07,"triangle");
});
(function(){var b=document.createElement("button");b.className="homeb";b.id="hmb";b.innerHTML="<span>🏠</span> Home";b.setAttribute("aria-label","Back to main menu");g.parentNode.appendChild(b);
 function sync(){var hide=g.classList.contains("hero2")||!!g.querySelector(".gd")||!!g.querySelector(".tbar");b.classList.toggle("show",!hide)}
 if(typeof MutationObserver!=="undefined")new MutationObserver(sync).observe(g,{childList:true,attributes:true,attributeFilter:["class"]});
 b.onclick=home;sync()})();
if(!P.seen)guide(0);else home();
</script></body></html>
