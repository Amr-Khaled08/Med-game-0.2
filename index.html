<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Med Game: Modules & XP</title>
<style>
:root{--bg:#fff8ec;--ink:#1d2a4a;--card:#fff;--line:#1d2a4a;--yel:#ffc83d;--cor:#ff6b57;--mint:#5fd3a6;--sky:#8cc8ff;--mut:#5b6785;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a30;--ink:#fff4dc;--card:#1c2745;--line:#fff4dc;--mut:#a9b3d1}}
:root[data-theme="dark"]{--bg:#121a30;--ink:#fff4dc;--card:#1c2745;--line:#fff4dc;--mut:#a9b3d1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;line-height:1.45;font-size:16px}
main{max-width:520px;margin:0 auto;padding:14px 14px 50px;position:relative}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;box-shadow:6px 6px 0 var(--line)}
h1{font-size:2.2rem;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.pill{display:inline-block;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.9rem;margin:0 6px 6px 0}
h2{margin:0 0 8px;font-size:1.3rem}
p{margin:6px 0}
small{color:var(--mut);font-weight:700}
.bar{height:10px;background:rgba(128,128,128,.25);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--cor);transition:width .3s}
.btn{font:inherit;font-weight:800;color:var(--onyel,#1d2a4a);background:var(--yel);border:3px solid var(--line);border-radius:14px;padding:11px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn:disabled{background:var(--card);color:var(--mut);border-style:dashed;box-shadow:none;cursor:not-allowed}
.btn:disabled small{color:var(--mut)}
.btn small,.hero small{color:var(--onyel,#1d2a4a)}
button:focus-visible{outline:3px solid var(--cor);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--mint);color:#10301f}
.opt.no{background:var(--cor);color:#2a0a05}
.q{font-weight:800;font-size:1.12rem;margin:8px 0}
.fb{min-height:3em;font-weight:600;margin:8px 0}
.tbar{height:12px;background:rgba(128,128,128,.25);border-radius:999px;overflow:hidden;border:2px solid var(--line)}
.tbar i{display:block;height:100%;width:100%;background:var(--mint)}
.hero{background:var(--yel);color:var(--onyel,#1d2a4a)}
.hero .bar{background:rgba(29,42,74,.2)}
.big{font-size:2.6rem;font-weight:800;margin:0}
.nav{display:block;width:100%;margin:10px 0;text-align:left;font-size:1.1rem}
.lec{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.lt{font-weight:800;margin-bottom:8px}
.tag{background:var(--line);color:var(--bg);font-size:.72rem;padding:2px 8px;border-radius:999px;margin-left:6px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv .btn{padding:8px 4px;font-size:.9rem;text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.btn.back{background:var(--card);color:var(--ink);box-shadow:none;margin-bottom:10px;padding:6px 14px}
:root[data-theme="cyberpunk"]{--bg:#0d0221;--ink:#00f0ff;--card:#190a38;--line:#ff007f;--yel:#ff007f;--cor:#ff003c;--mint:#00f0ff;--sky:#7000ff;--mut:#9a4bff}
:root[data-theme="biohazard"]{--bg:#0b1d0e;--ink:#55ff55;--card:#132e17;--line:#33cc33;--yel:#33cc33;--cor:#ff3300;--mint:#55ff55;--sky:#1a5e22;--mut:#2f8537}
:root[data-theme="gold"]{--bg:#1a1400;--ink:#ffe680;--card:#332900;--line:#ffd700;--yel:#ffd700;--cor:#ff4500;--mint:#ffe680;--sky:#806600;--mut:#b39700}
h3{margin:14px 0 4px;font-size:1.05rem}
.shop{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.shop.me{background:var(--yel);color:var(--onyel,#1d2a4a)}
.shop.me small{color:var(--onyel,#1d2a4a)}
.shop .btn{padding:6px 10px;font-size:.85rem;white-space:nowrap}
.pb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pw{flex:1 1 30%;padding:6px;font:inherit;font-size:.85rem;font-weight:800;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;cursor:pointer}
.pw:disabled{opacity:.45;cursor:not-allowed}
.opp{background:var(--sky);color:#10243f;border:2px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px;font-weight:700;font-size:.9rem}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.25em;text-align:center;margin:10px 0}
input[type="text"]{font:inherit;font-weight:800;text-align:center;width:100%;padding:10px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:8px 0}
:root[data-theme="bubblegum"]{--bg:#ffe3f1;--ink:#4a1d3a;--card:#fff;--line:#4a1d3a;--yel:#ff8fc8;--cor:#ff4f9a;--mint:#9be8d0;--sky:#b9a6ff;--mut:#8a5a7c}
:root[data-theme="sunset"]{--bg:#2b1055;--ink:#ffe9d6;--card:#3d1a78;--line:#ff9a5a;--yel:#ff8a5f;--cor:#ff4d6d;--mint:#ffd166;--sky:#7b5cff;--mut:#c9a6ff}
:root[data-theme="forest"]{--bg:#eaf4e1;--ink:#1f3d2b;--card:#fff;--line:#1f3d2b;--yel:#8fd16a;--cor:#e2724a;--mint:#9be8b8;--sky:#a8d8ea;--mut:#5b7a63}
:root[data-theme="lavender"]{--bg:#f0e9ff;--ink:#2f2554;--card:#fff;--line:#2f2554;--yel:#b79cff;--cor:#ff7aa8;--mint:#9be8d0;--sky:#8cc8ff;--mut:#6b5f94}
:root[data-theme="midnight"]{--bg:#05070d;--ink:#e8eefc;--card:#0d1424;--line:#5b8cff;--yel:#6b97ff;--cor:#ff5d73;--mint:#4be0b0;--sky:#2a4fb0;--mut:#7f8db3}
:root[data-theme="mint"]{--bg:#e6fbf3;--ink:#12423a;--card:#fff;--line:#12423a;--yel:#5fd3a6;--cor:#ff8a6b;--mint:#b6f0d8;--sky:#8cc8ff;--mut:#4f7f75}
:root[data-theme="volcano"]{--bg:#1a0a08;--ink:#ffd9c2;--card:#2e130e;--line:#ff5a1f;--yel:#ff8a3d;--cor:#ffb703;--mint:#ffd166;--sky:#7a2e1a;--mut:#c98a6e}
:root[data-theme="ocean"]{--bg:#06202f;--ink:#d6f4ff;--card:#0c3248;--line:#6fd3ff;--yel:#3fc1e8;--cor:#ff7a6b;--mint:#5fe3c0;--sky:#2a6f9a;--mut:#86b9d2}
.cf{position:fixed;top:-30px;font-size:1.4rem;pointer-events:none;z-index:9;animation:cf 2.2s linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.card.shake{animation:sk .3s}
@keyframes sk{0%,100%{transform:translate(0)}25%{transform:translate(-6px)}75%{transform:translate(6px)}}
.meta{display:flex;justify-content:space-between;margin:4px 0}
.hype{position:fixed;top:16%;left:50%;transform:translateX(-50%);z-index:10;background:var(--yel);color:var(--onyel,#1d2a4a);border:3px solid var(--line);border-radius:999px;padding:8px 20px;font-weight:800;box-shadow:4px 4px 0 var(--line);pointer-events:none;white-space:nowrap;animation:hp 1.3s ease-out forwards}
@keyframes hp{0%{transform:translate(-50%,14px) scale(.5);opacity:0}18%{transform:translate(-50%,0) scale(1.15);opacity:1}30%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.hype{animation:none}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:60;max-width:88%;text-align:center;background:var(--yel);color:var(--onyel,#1d2a4a);border:3px solid var(--line);border-radius:18px;padding:10px 18px;font-weight:800;box-shadow:4px 4px 0 var(--line);pointer-events:none;animation:tp 2.8s ease-out forwards}
@keyframes tp{0%{opacity:0;margin-top:-10px}10%{opacity:1;margin-top:0}85%{opacity:1}100%{opacity:0}}
.sbal{display:flex;justify-content:space-between;align-items:center;gap:8px}.sbal h2{margin:0}.sbal .pill{margin:0;font-size:1.05rem}
.s2tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 14px}
.s2tab{font:inherit;font-weight:800;font-size:1.2rem;line-height:1.2;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 2px;cursor:pointer;min-height:54px}.s2tab small{font-size:.62rem;color:var(--mut)}.s2tab.on{background:var(--yel);color:var(--onyel,#1d2a4a)}.s2tab.on small{color:#1d2a4a}
.s2g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.s2g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.s2c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:12px 8px}.s2c.s2wide{grid-column:1/-1}.s2c .s2em{font-size:2.2rem;line-height:1.1;width:100%}.s2c.s2wide .s2em{font-size:3rem}.s2c b{font-size:.95rem}.s2c small{color:var(--mut);font-weight:600;font-size:.78rem;flex:1}.s2c .btn{width:100%;margin-top:6px;padding:8px 6px;font-size:.9rem}.s2c.s2eq{border-color:var(--mint);box-shadow:0 0 0 2px var(--mint)}
.btn.cant{background:var(--card);color:var(--mut);border-style:dashed;box-shadow:none}
.s2tp{width:100%;height:46px;border-radius:10px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:1.2rem}.s2tp i{width:14px;height:14px;border-radius:50%;display:block}
.s2ban{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:6;display:flex;align-items:center;gap:10px;background:var(--yel);color:var(--onyel,#1d2a4a);border:3px solid var(--line);border-radius:18px;padding:6px 12px;margin:10px 0 8px;box-shadow:3px 3px 0 var(--line)}
.s2ban .s2mas{flex:none;width:58px;height:58px;cursor:pointer;animation:s2bob 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.s2mas svg{width:100%;height:100%;overflow:visible;display:block}
.ow-b{transform-box:view-box;transform-origin:50px 92px;animation:s2tilt 5s ease-in-out infinite}
@keyframes s2tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.ow-e{transform-box:fill-box;transform-origin:center;animation:s2blink 4.2s infinite}
.ow-e.b{animation-delay:.03s}
@keyframes s2blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.ow-p{animation:s2look 7s ease-in-out infinite}
@keyframes s2look{0%,35%,100%{transform:translate(0,0)}42%,58%{transform:translate(2.6px,.5px)}66%,86%{transform:translate(-2.6px,-.5px)}}
.ow-w{transform-box:fill-box;transform-origin:50% 12%}
.s2mas.happy,.s2mas.hop{animation:s2jump .7s ease-out}
.s2mas.happy .ow-w.l,.s2mas.hop .ow-w.l{animation:s2wl .25s ease-in-out 3}
.s2mas.happy .ow-w.r,.s2mas.hop .ow-w.r{animation:s2wr .25s ease-in-out 3}
@keyframes s2jump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.08)}60%{transform:translateY(0) scale(.96)}78%{transform:translateY(-5px)}}
@keyframes s2wl{50%{transform:rotate(40deg)}}
@keyframes s2wr{50%{transform:rotate(-40deg)}}
.s2mas.sad{animation:s2sad .6s ease-in-out}
.s2mas.sad .ow-p{animation:none;transform:translateY(3px)}
@keyframes s2sad{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.s2ban .s2bub{flex:1;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-weight:700;font-size:.85rem}
.s2ban .s2bal{display:block;font-size:1.35rem;font-weight:800;line-height:1.2}
@keyframes s2bob{50%{transform:translateY(-4px)}}
.s2sub{display:block;margin:2px 0 10px;color:var(--mut);font-weight:700}
.s2tp{height:64px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:2px solid var(--line)}
.s2pg{height:6px;background:rgba(128,128,128,.28);border-radius:99px;overflow:hidden;width:100%;margin-top:6px}.s2pg i{display:block;height:100%;background:var(--cor)}
.s2c.s2lk .s2em{filter:grayscale(.7);opacity:.75}
.s2c.s2deal{border-color:var(--cor);box-shadow:0 0 0 2px var(--cor)}.s2c .tag{margin:0;font-size:.7rem}.s2c s{opacity:.6;margin-right:4px}
.s2c.s2bxh{background:linear-gradient(145deg,var(--yel),var(--cor));color:var(--onyel,#1d2a4a);border-color:var(--line)}.s2c.s2bxh small{color:var(--onyel,#1d2a4a)}.s2c.s2bxh b{font-size:1.15rem}.s2c.s2bxh .s2em{animation:s2shk 2.8s ease-in-out infinite}
@keyframes s2shk{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(-12deg)}80%{transform:rotate(10deg)}86%{transform:rotate(-8deg)}92%{transform:rotate(5deg)}}
.s2bx{font-size:5rem;line-height:1;animation:s2shk2 .9s ease-in-out}
@keyframes s2shk2{0%,100%{transform:rotate(0) scale(1)}15%{transform:rotate(-16deg) scale(1.08)}35%{transform:rotate(14deg) scale(1.12)}55%{transform:rotate(-12deg) scale(1.16)}75%{transform:rotate(10deg) scale(1.2)}}
.s2pz{font-size:5rem;line-height:1.1;animation:s2pop .5s ease-out}
@keyframes s2pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ow-b,.ow-e,.ow-p,.s2mas.happy,.s2mas.hop,.s2mas.sad,.ow-w{animation:none!important}.s2ban .s2mas,.s2c.s2bxh .s2em,.s2bx,.s2pz{animation:none}}
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:20px}.mbox{max-width:360px;width:100%}.mbox p{font-weight:700;margin:0 0 6px}
.hw{background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;border:3px solid var(--line);border-radius:18px;padding:14px;margin:8px 0;box-shadow:4px 4px 0 var(--line)}
.hw .top{display:flex;align-items:center;gap:14px}
.hw .ring{flex:none;width:96px;height:96px;margin:0}.hw .ring b{color:var(--ink);font-size:1.4rem}
.hw h4{margin:0 0 4px;font-size:1.2rem}.hw p{margin:0}.hw small{color:#fff;opacity:.92;font-weight:700}
.hw .wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px;text-align:center}
.hw .wk div{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 2px}
.hw .wk b{display:block;font-size:1.15rem}.hw .wk small{font-size:.7rem}
.ins{display:flex;gap:10px;align-items:center;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 10px;margin:8px 0}
.ins span{font-size:1.5rem}.ins small{color:var(--mut)}
.btn.on{background:var(--yel);color:var(--onyel,#10243f)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.col{display:flex;flex-direction:column;gap:8px}
.mi{font:inherit;font-weight:700;font-size:.9rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;min-height:48px}
.mi.sel{background:var(--yel);color:var(--onyel,#1d2a4a);transform:scale(1.03)}
.mi.ok{background:var(--mint);color:#10301f}
.mi.no{background:var(--cor);color:#2a0a05}
.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),rgba(128,128,128,.25) 0);display:grid;place-items:center;margin:6px auto;position:relative}
.ring::before{content:"";position:absolute;inset:11px;background:var(--card);border-radius:50%}
.ring b{position:relative;font-size:1.6rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:10px 0}
.stats div{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-size:1.15rem}
.rv{background:var(--bg);border-left:5px solid var(--cor);border-radius:8px;padding:8px 10px;margin:6px 0}
.tbar{transition:border-color .2s}
.tbar i{transition:width .06s linear}
.tbar.low{border-color:var(--cor);animation:pl .5s infinite}
@keyframes pl{50%{transform:scaleY(1.7)}}
.tc{text-align:right;font-weight:800;font-size:.9rem;margin:2px 0 4px}
.nxb{height:5px;background:rgba(128,128,128,.25);border-radius:999px;overflow:hidden;margin:10px 0 4px}
.nxb i{display:block;height:100%;width:0;background:var(--cor);animation:nx linear forwards}
@keyframes nx{to{width:100%}}
.card.fo{animation:fo .5s}
.card.fn{animation:fn .5s}
@keyframes fo{40%{box-shadow:0 0 0 6px var(--mint),6px 6px 0 var(--line)}}
@keyframes fn{40%{box-shadow:0 0 0 6px var(--cor),6px 6px 0 var(--line)}}
@media (prefers-reduced-motion:reduce){.tbar.low{animation:none}}
:root{--h1:#6d4aff;--h2:#14b8a6}
:root[data-theme="cyberpunk"]{--h1:#ff007f;--h2:#7000ff}
:root[data-theme="biohazard"]{--h1:#1a8f2a;--h2:#0b6b5a}
:root[data-theme="gold"]{--h1:#b8860b;--h2:#ff8c00}
:root[data-theme="bubblegum"]{--h1:#ff4f9a;--h2:#9d7bff}
:root[data-theme="ocean"]{--h1:#0b6fa4;--h2:#14b8a6}
:root[data-theme="sunset"]{--h1:#ff7e5f;--h2:#7b5cff}
:root[data-theme="forest"]{--h1:#2e7d32;--h2:#7cb342}
:root[data-theme="lavender"]{--h1:#8e6bff;--h2:#ff7aa8}
:root[data-theme="midnight"]{--h1:#1e40af;--h2:#6d28d9}
:root[data-theme="mint"]{--h1:#0f9f7a;--h2:#38bdf8}
:root[data-theme="volcano"]{--h1:#dc2626;--h2:#f59e0b}
.card.hero2{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;text-align:center}
.hero2 small{color:rgba(255,255,255,.92)}
.hero2 .bar{background:rgba(255,255,255,.28)}
.hero2 .bar i{background:#ffd23f}
.mute{position:absolute;top:10px;right:10px;z-index:2;font-size:1.15rem;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);border-radius:50%;width:42px;height:42px;cursor:pointer;color:#fff}
.mas{width:128px;height:128px;border-radius:50%;margin:6px auto 4px;display:grid;place-items:center;position:relative;cursor:pointer;background:conic-gradient(#ffd23f calc(var(--p)*1%),rgba(255,255,255,.3) 0);animation:fl 3.2s ease-in-out infinite}
.mas::before{content:"";position:absolute;inset:8px;border-radius:50%;background:rgba(0,0,0,.28)}
.mas span{position:relative;font-size:3.4rem;line-height:1}
.mas em{position:absolute;bottom:-4px;right:-4px;background:#ffd23f;color:#1d2a4a;border:3px solid #fff;border-radius:999px;min-width:36px;height:36px;display:grid;place-items:center;font-style:normal;font-weight:800}
.mas.bnc{animation:bn .5s}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes bn{30%{transform:scale(1.2) rotate(-8deg)}60%{transform:scale(.95) rotate(6deg)}}
.say{background:#fff;color:#1d2a4a;border-radius:16px;padding:8px 12px;margin:10px auto 12px;font-weight:700;display:inline-block;max-width:92%}
.say.pop{animation:pp .35s}

/* ===== WOW home ===== */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
html,body,button,.mas,.say,.tile,.logo,.fl,.play{-webkit-tap-highlight-color:transparent}
.mas,.mas *,.say,.tile,.logo,.fl,.play,.hero2 .pill{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mas,.say,.logo{outline:none}
.card.hero2{animation:hin .6s ease both}
@keyframes hin{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.hero2>*:not(.aur):not(.fl){position:relative;z-index:1}
.aur{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aur i{position:absolute;width:230px;height:230px;border-radius:50%;filter:blur(44px);opacity:.5;animation:aurb 9s ease-in-out infinite alternate}
.aur i:nth-child(1){background:#ff5d7a;top:-70px;left:-60px}
.aur i:nth-child(2){background:#5fd3a6;top:38%;right:-80px;animation-delay:-3s}
.aur i:nth-child(3){background:#ffd23f;bottom:-80px;left:18%;opacity:.35;animation-delay:-6s}
@keyframes aurb{to{transform:translate(40px,50px) scale(1.3)}}
.f5{left:44%;top:3%;animation-delay:-3s}.f6{right:30%;top:58%;animation-delay:-5s}
.logo{font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:2px 0 0;background:linear-gradient(90deg,#fff 0%,#ffd23f 50%,#fff 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shm 4s linear infinite}
@keyframes shm{to{background-position:-200% 0}}
.hero2 .mas{z-index:1}
.hero2 .mas::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.6),transparent 68%);z-index:-1;animation:glw 2.4s ease-in-out infinite}
@keyframes glw{50%{transform:scale(1.15);opacity:.6}}
.hero2 .say{background:rgba(255,255,255,.95);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.hero2 .pill{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero2 .bar{height:12px}
.hero2 .bar i{background:linear-gradient(90deg,#ffd23f,#ff9a5a,#ffd23f);background-size:200% 100%;animation:shm 2.5s linear infinite}
.play{position:relative;overflow:hidden;font-size:1.5rem;letter-spacing:.02em;box-shadow:0 5px 0 rgba(0,0,0,.3),0 0 26px rgba(255,210,63,.55)}
.play::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shn 3s ease-in-out infinite}
@keyframes shn{0%,55%{left:-60%}100%{left:130%}}
.hero2 .btn.quick{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.5);box-shadow:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.hero2 .btn.quick.dcb{color:#10301f;border:3px solid transparent;background:linear-gradient(#7ae6bd,#4fcf9f) padding-box,conic-gradient(from var(--a),#ffd23f,#ff5d7a,#9d7bff,#5fd3a6,#ffd23f) border-box;animation:rot 4s linear infinite;box-shadow:0 0 18px rgba(95,211,166,.55)}
@keyframes rot{to{--a:360deg}}
.tile{position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.75);box-shadow:0 5px 0 rgba(0,0,0,.28),0 10px 18px rgba(0,0,0,.18)}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.4),transparent 55%);pointer-events:none}
.tile b{filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));transition:transform .25s}
.tile:hover b,.tile:active b{transform:scale(1.2) rotate(-8deg)}
